name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# A second push while one deploy is mid-flight would race the migration step
# against the upload. Queue them instead, and never cancel a running deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `wrangler deploy` bundles with esbuild, which strips types without
      # checking them. Without this step a type error ships.
      - run: npm run typecheck

      - run: npm test

      # Migrations run first and on their own: the Worker that follows may read
      # columns this adds, and a deploy that lands ahead of its migration
      # writes to columns that don't exist yet.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply snack-bot --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
